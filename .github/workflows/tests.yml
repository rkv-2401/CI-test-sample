name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:            # adds a "Run workflow" button in the Actions tab
  
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false          # keep the other three running when one fails
      matrix:
        include:
          - name: unittest
            cmd: python -m unittest discover -s tests -v
          - name: pytest
            cmd: python -m pytest -rfEs
          # Parallel runs are off: the hazard tests fail under xdist (see README).
          # - name: xdist
          #   cmd: python -m pytest -n 4 -rfEs
          # - name: xdist-loadscope
          #   cmd: python -m pytest -n 4 --dist loadscope -rfEs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-xdist
      - run: ${{ matrix.cmd }}   